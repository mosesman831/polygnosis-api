# PolyGnosis API — model routing for the full boardroom pipeline.
# Use OpenAI-compatible model IDs (provider/model or bare model names).

models:
  orchestrator: "anthropic/claude-sonnet-4"
  solver_1: "openai/gpt-5"
  solver_2: "anthropic/claude-sonnet-4"
  solver_3: "google/gemini-2.5-pro"
  critic: "anthropic/claude-sonnet-4"
  synthesizer: "anthropic/claude-sonnet-4"
  scorer: "anthropic/claude-sonnet-4"
  meta_reviewer: "anthropic/claude-sonnet-4"
  fallback: "anthropic/claude-sonnet-4"

# Explicit solver list overrides solver_1/2/3 when non-empty
solver_models: []

settings:
  solver_count: 3
  solver_timeout_sec: 600
  critic_timeout_sec: 600
  synthesizer_timeout_sec: 300
  meta_reviewer_timeout_sec: 180
  orchestrator_timeout_sec: 120

  # Scoring: rrf | borda | hybrid (default — most robust)
  scoring_algorithm: "hybrid"
  rrf_k: 60

  # max_debate_rounds = N means N critique passes; revisions happen between
  # rounds. So N=1 is critique only (no revise); N=2 is critique, revise,
  # critique; and so on.
  max_debate_rounds: 2
  min_solvers_for_quorum: 2
  quality_gate_enabled: true
  early_resolution_enabled: true

  # Per-role sampling. Solvers run hotter for diversity; scorer is
  # deterministic. Defaults apply to any role not listed here.
  temperature_solver: 0.5
  temperature_critic: 0.2
  temperature_scorer: 0.0
  temperature_default: 0.3
  max_tokens_solver: 8192
  max_tokens_default: 4096
